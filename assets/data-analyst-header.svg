<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">Soufiane — Data Analyst and BI Developer</title>
  <desc id="desc">An animated terminal introduces Soufiane and lists his data analytics skills.</desc>
  <defs>
    <clipPath id="window"><rect x="1" y="1" width="898" height="298" rx="11"/></clipPath>
    <clipPath id="type1"><rect x="36" y="52" width="0" height="23"><animate attributeName="width" from="0" to="112" begin=".35s" dur=".55s" fill="freeze"/></rect></clipPath>
    <clipPath id="type2"><rect x="36" y="76" width="0" height="23"><animate attributeName="width" from="0" to="370" begin="1s" dur="1.2s" fill="freeze"/></rect></clipPath>
    <clipPath id="type3"><rect x="36" y="108" width="0" height="23"><animate attributeName="width" from="0" to="178" begin="2.3s" dur=".7s" fill="freeze"/></rect></clipPath>
    <clipPath id="type4"><rect x="36" y="132" width="0" height="23"><animate attributeName="width" from="0" to="470" begin="3.1s" dur="1.25s" fill="freeze"/></rect></clipPath>
    <clipPath id="type5"><rect x="36" y="164" width="0" height="23"><animate attributeName="width" from="0" to="160" begin="4.45s" dur=".65s" fill="freeze"/></rect></clipPath>
    <clipPath id="type6"><rect x="36" y="188" width="0" height="25"><animate attributeName="width" from="0" to="590" begin="5.2s" dur="1.35s" fill="freeze"/></rect></clipPath>
    <style>
      .terminal { font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", Consolas, monospace; }
      @media (prefers-reduced-motion: reduce) {
        .typed { clip-path: none; }
        .cursor { animation: none; opacity: 1; }
        .idlePrompt { opacity: 1; }
      }
    </style>
  </defs>

  <g clip-path="url(#window)">
    <rect width="900" height="300" fill="#0a0a0f"/>
    <rect width="900" height="34" fill="#15151c"/>
    <path d="M0 34H900" stroke="#2a2a34"/>

    <circle cx="20" cy="17" r="5" fill="#ff5f56"/>
    <circle cx="38" cy="17" r="5" fill="#ffbd2e"/>
    <circle cx="56" cy="17" r="5" fill="#27c93f"/>
    <text class="terminal" x="450" y="21" fill="#868692" font-size="11" text-anchor="middle">soufiane@portfolio: ~</text>

    <g class="terminal" font-size="14">
      <g class="typed" clip-path="url(#type1)">
        <text x="36" y="69"><tspan fill="#5b7fff">$</tspan><tspan fill="#f2f2f0"> whoami</tspan></text>
      </g>

      <g class="typed" clip-path="url(#type2)">
        <text x="36" y="93" fill="#c9c9d1">Soufiane — Data Analyst / BI Developer</text>
      </g>

      <g class="typed" clip-path="url(#type3)">
        <text x="36" y="125"><tspan fill="#5b7fff">$</tspan><tspan fill="#f2f2f0"> role --current</tspan></text>
      </g>

      <g class="typed" clip-path="url(#type4)">
        <text x="36" y="149" fill="#c9c9d1">Turning operational data into trusted decisions.</text>
      </g>

      <g class="typed" clip-path="url(#type5)">
        <text x="36" y="181"><tspan fill="#5b7fff">$</tspan><tspan fill="#f2f2f0"> skills --list</tspan></text>
      </g>

      <g class="typed" clip-path="url(#type6)">
        <text x="36" y="205">
          <tspan fill="#5b7fff">[</tspan><tspan fill="#c9c9d1">Excel</tspan><tspan fill="#5b7fff">]</tspan>
          <tspan fill="#5b7fff"> [</tspan><tspan fill="#c9c9d1">Power BI</tspan><tspan fill="#5b7fff">]</tspan>
          <tspan fill="#5b7fff"> [</tspan><tspan fill="#c9c9d1">DAX</tspan><tspan fill="#5b7fff">]</tspan>
          <tspan fill="#5b7fff"> [</tspan><tspan fill="#c9c9d1">SQL</tspan><tspan fill="#5b7fff">]</tspan>
          <tspan fill="#5b7fff"> [</tspan><tspan fill="#c9c9d1">Data Modeling</tspan><tspan fill="#5b7fff">]</tspan>
        </text>
      </g>

      <g class="idlePrompt" opacity="0">
        <animate attributeName="opacity" values="0;1" begin="6.65s" dur=".01s" fill="freeze"/>
        <text x="36" y="257" fill="#5b7fff">$</text>
        <rect class="cursor" x="53" y="244" width="8" height="16" rx="1" fill="#f2f2f0">
          <animate attributeName="opacity" values="1;0;1" begin="6.65s" dur="1s" calcMode="discrete" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

  </g>
  <rect x=".5" y=".5" width="899" height="299" rx="11.5" fill="none" stroke="#31313b"/>
</svg>
