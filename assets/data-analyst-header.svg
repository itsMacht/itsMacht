<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Soufiane — Data Analyst and BI Developer</title>
  <desc id="desc">Editorial portfolio header with a weekly signal chart and animated analytics skills ticker.</desc>
  <defs>
    <clipPath id="frame"><rect width="1200" height="300" rx="14"/></clipPath>
    <clipPath id="ticker"><rect y="236" width="1200" height="64"/></clipPath>
    <style>
      .ui { font-family: Aptos, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .editorial { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
      .mono { font-family: "Cascadia Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .staticTicker { display: none; }
      @media (prefers-reduced-motion: reduce) {
        .motion, .motionTicker { display: none; }
        .staticTicker { display: block; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="#0b0e13"/>
    <path d="M0 44H1200M660 44V236" fill="none" stroke="#ffffff" stroke-opacity=".11"/>
    <path d="M24 0V236M1176 0V236" fill="none" stroke="#ffffff" stroke-opacity=".055"/>

    <g class="mono" fill="#7f8998" font-size="10" letter-spacing="1.65">
      <text x="40" y="27">PORTFOLIO / DATA ANALYTICS</text>
      <text x="1160" y="27" text-anchor="end">CASABLANCA · MA</text>
    </g>

    <g>
      <text class="ui" x="58" y="90" fill="#9dbbff" font-size="13" font-weight="600" letter-spacing="2.2">DATA ANALYST &amp; BI DEVELOPER</text>
      <text class="editorial" x="54" y="160" fill="#f1eee7" font-size="68" font-weight="400" letter-spacing="-2">Soufiane</text>
      <text class="ui" x="58" y="200" fill="#a8afb9" font-size="17" font-weight="400">Turning operational data into clear, trusted decisions.</text>
    </g>

    <g transform="translate(704 66)">
      <g class="mono" font-size="10" letter-spacing="1.35">
        <text x="0" y="0" fill="#737d8c">WEEKLY SIGNAL</text>
        <text x="436" y="0" fill="#737d8c" text-anchor="end">REFRESH / W36</text>
      </g>

      <g transform="translate(0 24)">
        <path d="M0 28H436M0 72H436M0 116H436" fill="none" stroke="#ffffff" stroke-opacity=".075"/>
        <path d="M0 116L55 108L109 111L164 79L218 86L273 53L327 62L382 23L436 32" fill="none" stroke="#d9e2f5" stroke-opacity=".26" stroke-width="1.25"/>
        <path class="motion" d="M0 116L55 108L109 111L164 79L218 86L273 53L327 62L382 23L436 32" fill="none" stroke="#9dbbff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="620" stroke-dashoffset="620">
          <animate attributeName="stroke-dashoffset" values="620;0;0" keyTimes="0;.58;1" dur="7.5s" repeatCount="indefinite"/>
        </path>
        <circle class="motion" r="3.8" fill="#f1eee7">
          <animateMotion path="M0 116L55 108L109 111L164 79L218 86L273 53L327 62L382 23L436 32" dur="7.5s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.58;1" calcMode="linear"/>
        </circle>
        <g fill="#0b0e13" stroke="#9dbbff" stroke-width="1.4">
          <circle cx="0" cy="116" r="3"/><circle cx="164" cy="79" r="3"/><circle cx="273" cy="53" r="3"/><circle cx="436" cy="32" r="3"/>
        </g>
      </g>

      <g class="mono" transform="translate(0 161)" font-size="9.5" letter-spacing="1">
        <text x="0" y="0" fill="#5d6775">RAW DATA</text><text x="79" y="0" fill="#3e4652">→</text>
        <text x="110" y="0" fill="#5d6775">CLEAN</text><text x="176" y="0" fill="#3e4652">→</text>
        <text x="207" y="0" fill="#5d6775">MODEL</text><text x="274" y="0" fill="#3e4652">→</text>
        <text x="305" y="0" fill="#9dbbff">DECIDE</text>
      </g>
    </g>

    <g clip-path="url(#ticker)">
      <rect y="236" width="1200" height="64" fill="#9dbbff"/>
      <path d="M0 236H1200" stroke="#c9d9ff" stroke-opacity=".55"/>
      <g class="mono motionTicker" fill="#101724" font-size="12" font-weight="700" letter-spacing="1.4">
        <text x="45" y="275" textLength="1110" lengthAdjust="spacing">POWER BI  •  DAX  •  SQL  •  EXCEL  •  DATA MODELING  •  KPI DESIGN  •  AUTOMATION  •  REPORTING</text>
        <text x="1245" y="275" textLength="1110" lengthAdjust="spacing">POWER BI  •  DAX  •  SQL  •  EXCEL  •  DATA MODELING  •  KPI DESIGN  •  AUTOMATION  •  REPORTING</text>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="18s" repeatCount="indefinite"/>
      </g>
      <text class="mono staticTicker" x="45" y="275" fill="#101724" font-size="12" font-weight="700" letter-spacing="1.4" textLength="1110" lengthAdjust="spacing">POWER BI  •  DAX  •  SQL  •  EXCEL  •  DATA MODELING  •  KPI DESIGN  •  AUTOMATION  •  REPORTING</text>
    </g>
  </g>

  <rect x=".5" y=".5" width="1199" height="299" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity=".14"/>
</svg>
