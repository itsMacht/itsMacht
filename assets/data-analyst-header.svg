<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Macht — Data Analyst and BI Developer</title>
  <desc id="desc">A restrained animated portfolio header with an analytical signal chart.</desc>
  <defs>
    <clipPath id="frame"><rect width="1200" height="300" rx="14"/></clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      @media (prefers-reduced-motion: reduce) { .motion { display: none; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="#0b0e13"/>
    <path d="M0 48H1200M0 252H1200M674 48V252" fill="none" stroke="#ffffff" stroke-opacity=".10"/>
    <path d="M24 0V300M1176 0V300" fill="none" stroke="#ffffff" stroke-opacity=".06"/>

    <g class="mono" fill="#8d96a5" font-size="11" letter-spacing="1.7">
      <text x="40" y="30">PORTFOLIO / 2026</text>
      <text x="1160" y="30" text-anchor="end">CASABLANCA · MA</text>
    </g>

    <g class="sans">
      <text x="58" y="106" fill="#9dbbff" font-size="15" font-weight="600" letter-spacing="2.4">DATA ANALYST · BI DEVELOPER</text>
      <text x="54" y="176" fill="#f3f0e8" font-size="64" font-weight="600" letter-spacing="-2.2">Macht</text>
      <text x="58" y="216" fill="#aab1bc" font-size="18" font-weight="400" letter-spacing=".15">Operational data into clear, trusted decisions.</text>
    </g>

    <g class="mono" font-size="11" letter-spacing="1.2">
      <text x="58" y="275" fill="#657080">EXCEL</text>
      <text x="126" y="275" fill="#3e4652">/</text>
      <text x="149" y="275" fill="#657080">POWER BI</text>
      <text x="240" y="275" fill="#3e4652">/</text>
      <text x="263" y="275" fill="#657080">DAX</text>
      <text x="307" y="275" fill="#3e4652">/</text>
      <text x="330" y="275" fill="#657080">SQL</text>
      <text x="374" y="275" fill="#3e4652">/</text>
      <text x="397" y="275" fill="#657080">DATA MODELING</text>
    </g>

    <g transform="translate(714 75)">
      <g class="mono" font-size="10" letter-spacing="1.4">
        <text x="0" y="0" fill="#727b89">WEEKLY SIGNAL</text>
        <text x="426" y="0" fill="#727b89" text-anchor="end">W36</text>
      </g>

      <g transform="translate(0 25)">
        <path d="M0 30H426M0 80H426M0 130H426" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
        <path d="M0 130L53 121L106 124L159 88L213 96L266 61L319 70L372 29L426 39" fill="none" stroke="#d9e2f5" stroke-opacity=".35" stroke-width="1.5"/>
        <path d="M0 130L53 121L106 124L159 88L213 96L266 61L319 70L372 29L426 39" fill="none" stroke="#9dbbff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="610" stroke-dashoffset="610">
          <animate attributeName="stroke-dashoffset" values="610;0;0" keyTimes="0;.55;1" dur="7s" repeatCount="indefinite"/>
        </path>
        <circle class="motion" r="4" fill="#f3f0e8">
          <animateMotion path="M0 130L53 121L106 124L159 88L213 96L266 61L319 70L372 29L426 39" dur="7s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.55;1" calcMode="linear"/>
        </circle>
        <g fill="#0b0e13" stroke="#9dbbff" stroke-width="1.5">
          <circle cx="0" cy="130" r="3"/><circle cx="159" cy="88" r="3"/><circle cx="266" cy="61" r="3"/><circle cx="426" cy="39" r="3"/>
        </g>
      </g>

      <g class="mono" transform="translate(0 166)" font-size="10" letter-spacing="1.1">
        <text x="0" y="0" fill="#596372">RAW</text>
        <text x="57" y="0" fill="#3e4652">→</text>
        <text x="89" y="0" fill="#596372">CLEAN</text>
        <text x="164" y="0" fill="#3e4652">→</text>
        <text x="196" y="0" fill="#596372">MODEL</text>
        <text x="271" y="0" fill="#3e4652">→</text>
        <text x="303" y="0" fill="#9dbbff">DECIDE</text>
      </g>
    </g>

    <rect class="motion" x="674" y="48" width="1" height="204" fill="#9dbbff" opacity="0">
      <animate attributeName="opacity" values="0;.7;0" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x=".5" y=".5" width="1199" height="299" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity=".13"/>
</svg>
